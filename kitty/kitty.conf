# ==============================================================================
# 1. FONTS & APPEARANCE
# ==============================================================================
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Disable annoying window decorations / padding for max screen real estate
window_padding_width 0
hide_window_decorations yes
confirm_os_window_close 0

# Background Transparency (Matches your Alacritty setup)
background_opacity 0.8
dynamic_background_opacity yes

# Cursor configuration (Vim block style)
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Terminal Bell
enable_audio_bell no

# ==============================================================================
# FONT RESIZING (ZOOM IN / OUT / RESET)
# ==============================================================================
# Zoom in (Ctrl + '+' or Ctrl + '=')
map ctrl+equal         change_font_size all +2.0
map ctrl+plus          change_font_size all +2.0
map ctrl+kp_add        change_font_size all +2.0

# Zoom out (Ctrl + '-')
map ctrl+minus         change_font_size all -2.0
map ctrl+kp_subtract   change_font_size all -2.0

# Reset to default font size (Ctrl + '0')
map ctrl+0             change_font_size all 0

# ==============================================================================
# KEYBINDINGS: VIM-STYLE SCROLLBACK & SEARCH
# ==============================================================================
# Dump current scrollback buffer straight into Neovim/Vim (Replaces tmux copy-mode)
# Opens buffer read-only, sets cursor at the bottom, and lets you use native / and v/y
map ctrl+shift+h show_scrollback
# Use Neovim as the scrollback pager
scrollback_pager nvim -c "set signcolumn=no nonumber norelativenumber binary" -c "set buftype=nofile" -c "autocmd TermOpen * normal G" -c "map <silent> q :qa!<CR>" -
