set -ag terminal-overrides ",xterm-256color:RGB"

# remap prefix from C-b to M-a
unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix
bind-key m display-popup -E -d '#{pane_current_path}' -w 60 -h 12 'printf "Session name: "; IFS= read -r name && [ -n "$name" ] || exit; directory=$( { printf "%s\n" "$HOME"; fd --type d --hidden --follow --exclude .git . "$HOME"; } | fzf --reverse --prompt="Directory > " --no-preview --color="fg:#cdd6f4,bg:#1e1e2e,hl:#cba6f7,fg+:#1e1e2e,bg+:#cba6f7,pointer:#a6e3a1"); [ -n "$directory" ] || exit; directory=${directory%/}; [ -n "$directory" ] || directory=/; tmux new-session -d -s "$name" -c "$directory" && tmux switch-client -t "=$name"'
bind-key '$' display-popup -E -w 50 -h 5 'printf "Rename session: "; IFS= read -r name && [ -n "$name" ] && tmux rename-session "$name"'
bind r source-file ~/.tmux.conf
bind z resize-pane -Z

# vi motion enabled
set-window-option -g mode-keys vi

# vi motion mapping
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position bottom          # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#{pane_current_command}"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "▼ #{pane_current_command}#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_session_color "#a6e3a1"
set -g @catppuccin_session_text "#{session_name}"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_color "#cba6f7"
set -g @catppuccin_directory_text "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run ~/.tmux/plugins/tpm/tpm

# apply after plugins so they take priority
bind-key s display-popup -E -w 40% -h 50% -T ' Sessions ' -s 'fg=#cdd6f4,bg=#1e1e2e' -S 'fg=#cba6f7' 'result=$(tmux list-sessions -F "#{session_name}" | fzf --reverse --no-preview --expect=ctrl-a --header="ctrl-a: new session · ctrl-x: kill" --bind="ctrl-x:execute-silent(tmux kill-session -t ={})+reload(tmux list-sessions -F \"#{session_name}\")" --prompt="Session > " --color="fg:#cdd6f4,bg:#1e1e2e,hl:#cba6f7,fg+:#1e1e2e,bg+:#cba6f7,pointer:#a6e3a1"); nl=$(printf "\\n_"); nl=${nl%_}; key=${result%%"$nl"*}; selection=${result#*"$nl"}; case "$key" in ctrl-a) printf "Session name: "; IFS= read -r name || exit; [ -n "$name" ] || exit; directory=$( { printf "%s\n" "$HOME"; fd --type d --hidden --follow --exclude .git . "$HOME"; } | fzf --reverse --prompt="Directory > " --no-preview --color="fg:#cdd6f4,bg:#1e1e2e,hl:#cba6f7,fg+:#1e1e2e,bg+:#cba6f7,pointer:#a6e3a1"); [ -n "$directory" ] || exit; directory=${directory%/}; [ -n "$directory" ] || directory=/; tmux new-session -d -s "$name" -c "$directory" && tmux switch-client -t "=$name" ;; *) [ -n "$selection" ] && tmux switch-client -t "=$selection" ;; esac'
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# pi keyboard
set -g extended-keys on
set -g extended-keys-format csi-u
